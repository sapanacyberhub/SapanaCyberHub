<!DOCTYPE html>
<html lang="en">

<head>
  
    <link rel="icon" type="image/png" href="/Assets/SapanaCyberHub-Logo.webp">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SapanaCyberHub/Blog</title>
  <link rel="stylesheet" href="/Decorate/blog.css" />
  <script type="module" src="/Mind/Blog.js" defer></script>
</head>

<body class="Blog-Parent">
  <!-- Background image handled in CSS -->
  <div class="Top-Action-Bar">
    <div class="Menu-Bar">
      <div class="Home" data-nav="Home">Home
      </div>
      <div class="Create-Blog" data-open-create>Create Blog</div>
      <div class="Services" data-nav="services">Services</div>
      <div class="Profile" data-nav="profile">Profile</div>
    </div>

    <div class="App-Nike">SapanaCyberHub</div>

    <div class="Prfile-Ic">
      <img class="User-Img" src="/Assets/SignUpBg.png" height="40" width="40" alt="Profile" />
      <div class="User-Name">John Don</div>
    </div>
  </div>

  <!-- Search & Filters -->
  <section class="Toolbar">
    <input id="searchInput" type="search" placeholder="Search blogs, titles, authors..." />
    <div class="filters">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="tech">Tech</button>
      <button class="chip" data-filter="cyber">Cyber</button>
      <button class="chip" data-filter="design">Design</button>
      <button class="chip" data-filter="life">Life</button>
    </div>
  </section>

  <!-- Feed -->
  <section class="Blog-Feed">
    <div class="Feed-Container" id="feedContainer">
      <!-- Cards render here by JS -->
    </div>
  </section>
  <!-- Create Blog Modal -->
  <div class="Modal-Overlay" id="createModal" aria-hidden="true">
    <div class="Modal">
      <div class="Modal-Head">
        <h3>Create Blog</h3>
        <button class="close" data-close-modal>&times;</button>
      </div>

      <form id="createBlogForm" novalidate>
        <div class="form-row">
          <label>Title <span class="req">*</span></label>
          <input type="text" name="title" placeholder="Enter a catchy title" required maxlength="100" />
        </div>

        <div class="form-row">
          <label>Category <span class="req">*</span></label>
          <select class="option-to-category" name="category" required>
            <option value="">Select category</option>
            <option value="tech">Tech</option>
            <option value="cyber">Cyber</option>
            <option value="design">Design</option>
            <option value="life">Life</option>
          </select>
        </div>

        <div class="form-row">
          <label>Description <span class="req">*</span></label>
          <textarea name="desc" rows="5" placeholder="Write your amazing story..." required minlength="20"
            maxlength="1200"></textarea>
        </div>

        <div class="form-row grid-2">
          <div>
            <label>Cover Image</label>
            <input type="file" accept="image/*" id="coverInput" />
            <small class="hint">Optional. JPG/PNG recommended.</small>
          </div>
          <div class="previewWrap">
            <img id="coverPreview" alt="Preview" class="preview hidden" />
            <div id="noPreview" class="noPreview">No image selected</div>
          </div>
        </div>

        <!-- 🔹 Upload Progress Bar -->
        <div class="progress-bar">
          <div class="upload-progress hidden" id="uploadProgress">
            <div class="progress-bar" id="progressBar"></div>
            <span id="progressText">0%</span>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="ghost" data-close-modal>Cancel</button>
          <button type="submit" class="primary">Publish</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Post View Drawer -->
  <aside id="postDrawer" class="Drawer" aria-hidden="true">
    <div class="Drawer-Head">
      <h3 id="drawerTitle">Post</h3>
      <button class="close" data-close-drawer>&times;</button>
    </div>
    <div class="Drawer-Body" id="drawerBody">
      <!-- Filled dynamically -->
    </div>
  </aside>


  <div id="container-b4d913493bf7a8df560d9a7b633f5918"></div>

</body>

<script async="async" data-cfasync="false"
    src="//pl28037543.effectivegatecpm.com/b4d913493bf7a8df560d9a7b633f5918/invoke.js"></script>

</html>
