<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Web Icon -->
    <link rel="icon" type="image/png" href="/assets/SapanaCyberHub-Logo.webp">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LogIn | SapanaCyberHub</title>
  <link rel="stylesheet" href="/css/LogIn.css">
  <script type="module" src="/js/LogInHandler.js"></script>
</head>

<body class="auth-page-L">
  <div class="auth-container-L">
    <h2>Welcome Back 💖</h2>
    <form id="LogInForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" id="loginBtn">LogIn</button>
    </form>
    <p class="SignUpOpt">New Member? <a href="signup.html">Sign Up</a></p>
  </div>

  <!-- ✅ Custom Dialog -->
  <div id="customDialog" class="custom-dialog" style="display:none;">
    <div class="dialog-content">
      <h2 class="dialog-title">Please Wait...</h2>
      <p class="dialog-message">Processing your login...</p>
      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <button id="closeDialog" class="dialog-btn">OK</button>
    </div>
  </div>
</body>
</html>
