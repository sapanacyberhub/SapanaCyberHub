<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Web Icon -->
    <link rel="icon" type="image/png" href="/Assets/SapanaCyberHub-Logo.webp">
    
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | SapanaCyberHub</title>
  <link rel="stylesheet" href="../Decorate/SignUp.css" />
</head>

<body class="auth-page">
  <div class="auth-container">
    <h2>Create Account</h2>

    <form id="signupForm">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />

      <!-- ✅ Custom button using div -->
      <div class="SignUpBtn" id="SignUpBtn">  </div>
    </form>

    <p class="loginOpt">
      Already have an account! <a href="login.html">LogIn</a>
    </p>
  </div>

  <!-- Custom Dialog -->
  <div id="customDialog" class="dialog-overlay">
    <div class="dialog-box">
      <h3 class="dialog-title">Creating Account...</h3>

      <!-- Progress Bar -->
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <p class="dialog-message">Please wait while we set up your account in SapanaCyberHub 💖</p>
      <button id="closeDialog" class="dialog-btn" style="display:none;">Okay</button>
    </div>
  </div>

</body>
<script type="module" src="../Mind/SignUpHandler.js"></script>
</html>
