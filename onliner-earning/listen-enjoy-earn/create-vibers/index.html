<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SapanaCyberHub X Listen | SignUp/SignIn</title>

    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js" defer></script>
</head>

<body>

    <div class="main">

        <div class="bg">
            <img src="https://kzrbqsvvauqugmuwxwse.supabase.co/storage/v1/object/public/bucket0001/SignUp-bg.png"
                alt="bg-img" loading="lazy">

        </div>
        <div class="page">
            <!-- LEFT VISUAL -->
            <div class="visual">
                <!-- replace with your cyberpunk girl PNG (transparent preferred) -->
                <img src="https://kzrbqsvvauqugmuwxwse.supabase.co/storage/v1/object/public/bucket0001/SignUp-bg-left%20girl%20n.png"
                    alt="Neon Girl Listening Music" loading="lazy">
            </div>

            <!-- RIGHT AUTH -->
            <div class="auth">
                <div class="card">
                    <h1 class="title" id="title">💖Create Account💖</h1>
                    <p> Learn • Fun • Enjoy And •Reward all are just waiting for You!</p>

                    <input type="text" id="name" class="smooth-hide" placeholder="Cute-Name">
                    <input type="email" id="email" placeholder="Email address">
                    <input type="password" id="password" placeholder="Password">

                    <div class="actions">
                        <img class="btn-primary" id="btn-primary"
                            src="https://kzrbqsvvauqugmuwxwse.supabase.co/storage/v1/object/public/bucket0001/vibe-btn.png"
                            alt="btn-secondary-Vibe" loading="lazy"></img>
                        <a class="btn-secondary" id="btn-secondary">I'm a Viber?</a>
                    </div>


                </div>

                <!-- AUTH PROGRESS DIALOG -->
                <div class="auth-progress hidden" id="authProgress">

                    <div class="progress-card">
                        <h3 id="progressTitle">Gettin you in Vibe</h3>
                        
                        <div class="eq-progress">
                            <span></span><span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span><span></span>
                        </div>
                        <p id="progressText">Please wait… warming up the vibes ❄️</p>


                    </div>
                </div>

            </div>

        </div>
    </div>
</body>

</html>
