<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViraLoop Community || Become a Member</title>
    <!-- join viraloop to convert your audience into money machine -->
    <meta name="description"
        content="Join ViraLoop community to convert your audience into a money-making machine. As a member, you can earn by sharing products and services with your followers. Sign up now to start monetizing your influence!">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main">
        <img class="bg"
            src="https://kzrbqsvvauqugmuwxwse.supabase.co/storage/v1/object/public/bucket0001/viraloop-community-login.png"
            alt="">
        <div class="overlay">
            <div class="content">
                <h1>Join <strong>ViraLoop</strong> Community</h1>
                <p>Convert your audience into a money-making machine by sharing products and services with your
                    followers.
                    Sign up now to start monetizing your influence!</p>
                <div class="form">
                    <input type="text" name="entry.123456789" placeholder="Your Name" required>
                    <input type="email" name="entry.987654321" placeholder="Your Email" required>
                    <input type="tel" name="entry.987654321" placeholder="Your Phone Number" required>
                    <!-- any one social media link -->
                    <div class="social-media-logos">
                        <!-- all social media logos from internet open source -->
                        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg"
                            alt="Facebook" class="social-logo">

                        <img src="https://upload.wikimedia.org/wikipedia/commons/c/ce/X_logo_2023.svg"
                            alt="X (formerly Twitter)" class="social-logo">

                        <img src="https://upload.wikimedia.org/wikipedia/commons/9/95/Instagram_logo_2022.svg"
                            alt="Instagram" class="social-logo">

                        <img src="https://upload.wikimedia.org/wikipedia/commons/8/81/LinkedIn_icon.svg" alt="LinkedIn"
                            class="social-logo">

                    </div>
                    <input type="url" name="entry.987654321" placeholder="Your Social Media Link" required>
                    <p class="form-note">By joining, you agree to our <strong>Terms of Service</strong> and <strong>Privacy Policy</strong>.</p>
                    <div type="submit">Join Now</div>
                    <div class="form-note">Already a member? <a href="#">Log in here</a>.</div>
                </div>
                

            </div>

        </div>
    </div>
</body>

</html>
