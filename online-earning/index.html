<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insta Gift Demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0b0f14;
      color: #fff;
      display: grid;
      place-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #121826;
      padding: 24px;
      border-radius: 16px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    .btn {
      margin-top: 16px;
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      background: linear-gradient(135deg, #ff4d6d, #ffa63d);
      color: #000;
    }
    .timer {
      margin-top: 12px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .popup .box {
      background: #121826;
      padding: 24px;
      border-radius: 16px;
      width: 300px;
      text-align: center;
    }
    .reward {
      margin-top: 10px;
      font-size: 20px;
      color: #7CFF7A;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Enjoy Insta Vibes 🎉</h2>
    <p>Relax for 5 seconds and unlock a surprise gift 🎁</p>
    <button id="startBtn" class="btn">Enjoy Insta</button>
    <div id="timer" class="timer"></div>
  </div>

  <!-- Gift Popup -->
  <div id="popup" class="popup">
    <div class="box">
      <h3>You unlocked a gift 🎁</h3>
      <p>Tap to claim your reward</p>
      <button id="claimBtn" class="btn">Claim Gift</button>
      <div id="reward" class="reward"></div>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const timerEl = document.getElementById("timer");
    const popup = document.getElementById("popup");
    const claimBtn = document.getElementById("claimBtn");
    const rewardEl = document.getElementById("reward");

    let countdown;

    startBtn.addEventListener("click", () => {
      // Open Instagram in new tab (safe way)
      window.open("https://www.instagram.com", "_blank");

      let time = 5;
      timerEl.textContent = time + "s";

      countdown = setInterval(() => {
        time--;
        timerEl.textContent = time + "s";

        if (time <= 0) {
          clearInterval(countdown);
          timerEl.textContent = "Gift unlocked 🎁";
          popup.style.display = "flex";
        }
      }, 1000);
    });

    claimBtn.addEventListener("click", () => {
      // Open ad link (demo placeholder)
      window.open("https://example.com", "_blank"); // replace with Monetag/Adsterra link

      // Fake reward (random LC)
      const reward = Math.floor(Math.random() * 5) + 1; // 1–5 LC
      rewardEl.textContent = `+${reward} Luck Credits 🎧✨`;

      // In real app → call your Cloud Function here
    });
  </script>

</body>
</html>
