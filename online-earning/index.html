<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Marathon Pro | Track & Vibe</title>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #2f3542;
            --bg: #0a0a0a;
            --card: #181818;
            --text: #ffffff;
            --success: #2ed573;
            --error: #ff6b6b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 850px;
            text-align: center;
            border: 1px solid #222;
        }

        h1 { margin-bottom: 1.5rem; font-weight: 800; font-size: 2.2rem; }

        /* Video Player */
        #player-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 25px;
            border: 2px solid #333;
        }

        /* Controls */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid #444;
            background: #252525;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(255, 71, 87, 0.2); }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
        }

        button:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* Timer UI */
        .timer-display {
            font-size: 4.5rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            color: var(--primary);
            margin: 10px 0;
            letter-spacing: 2px;
        }

        .stats-box {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
        }

        .stat-item { font-size: 0.85rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .stat-val { color: var(--success); font-weight: bold; }

        /* Toast Dialogs */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
        }

        .toast {
            background: #ffffff;
            color: #1a1a1a;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transform: translateX(180%);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            min-width: 300px;
        }

        .toast.show { transform: translateX(0); }
        .toast.error-theme { border-left: 6px solid var(--error); background: #fff5f5; }
        .toast.error-theme .toast-header { color: var(--error); }

        .toast-header { font-weight: 800; font-size: 1.1rem; }
        .toast-body { font-size: 0.95rem; color: #444; }

        .toast-actions { display: flex; gap: 10px; margin-top: 5px; }
        .btn-play { background: var(--primary); color: white; flex: 2; padding: 10px; }
        .btn-save { background: #eee; color: #333; flex: 1; padding: 10px; }

        /* Modal Popup */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 5000;
        }

        .popup {
            background: var(--secondary);
            padding: 3rem;
            border-radius: 24px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #444;
        }

        .active { display: flex; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎧 Music Marathon</h1>
        
        <div class="input-group">
            <input type="text" id="ytLink" placeholder="Paste YouTube link here (e.g., https://youtu.be/...)">
            <button onclick="handleInput()">Load Song</button>
        </div>

        <div id="player-container">
            <div id="player"></div>
        </div>

        <div class="timer-display" id="timer">00:00:00</div>
        
        <div class="stats-box">
            <div class="stat-item">SESSION ACTIVE</div>
            <div style="color: #444;">|</div>
            <div class="stat-item">TOTAL MARATHON TIME: <span id="totalSaved" class="stat-val">0</span>s</div>
        </div>
    </div>

    <div class="overlay" id="finishPopup">
        <div class="popup">
            <h2 style="font-size: 2.2rem; margin-top: 0;">Nicely Done! 🏆</h2>
            <p>You vibed for <strong id="sessionTime" style="color:var(--primary)">0</strong> seconds this session.</p>
            <div style="display:flex; flex-direction: column; gap: 12px; margin-top: 30px;">
                <button onclick="saveTime()">Save Progress & Reset</button>
                <button style="background:transparent; border: 1px solid #555" onclick="closePopup()">Keep Current Session</button>
            </div>
        </div>
    </div>

    <div class="toast-container">
        <div id="songToast" class="toast">
            <div class="toast-header" id="toastHeader">New Song Detected</div>
            <div class="toast-body" id="toastMessage">Would you like to start a new session with this track?</div>
            <div id="toastActions" class="toast-actions">
                <button class="btn-play" onclick="confirmPlay()">Play Now</button>
                <button class="btn-save" onclick="hideToast()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let timerInterval;
        let seconds = 0;
        let isRunning = false;
        let pendingVideoId = null;

        // 1. YouTube API Initialization
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: 'jfKfPfyJRdk', // Initial Lofi track
                playerVars: { 
                    'autoplay': 0, 
                    'modestbranding': 1,
                    'rel': 0 
                },
                events: { 
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError 
                }
            });
        }

        // 

        // 2. State & Error Handling
        function onPlayerStateChange(event) {
            // PLAYING = 1
            if (event.data == YT.PlayerState.PLAYING) {
                startTimer();
            } else {
                stopTimer();
            }
            // ENDED = 0
            if (event.data == YT.PlayerState.ENDED) {
                showFinishPopup();
            }
        }

        function onPlayerError(event) {
            // Error 101/150 = Embedding restricted by uploader
            if (event.data === 101 || event.data === 150) {
                showToast("Embedding Restricted", "This video cannot be played on external sites. Try another one!", true);
            } else {
                showToast("Playback Error", "YouTube couldn't load this video (Error code: " + event.data + ")", true);
            }
        }

        // 3. Timer Engine
        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                timerInterval = setInterval(() => {
                    seconds++;
                    updateDisplay();
                }, 1000);
            }
        }

        function stopTimer() {
            isRunning = false;
            clearInterval(timerInterval);
        }

        function updateDisplay() {
            const hrs = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const mins = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${hrs}:${mins}:${secs}`;
        }

        // 4. Link & Toast Logic
        function handleInput() {
            const url = document.getElementById('ytLink').value;
            const videoId = extractId(url);
            
            if (videoId) {
                pendingVideoId = videoId;
                showToast("New Song Detected", "Ready to start the marathon with this track?");
            } else {
                showToast("Invalid URL", "Please paste a valid YouTube video link.", true);
            }
        }

        function extractId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : null;
        }

        function showToast(header, msg, isError = false) {
            const toast = document.getElementById('songToast');
            const actions = document.getElementById('toastActions');
            
            document.getElementById('toastHeader').innerText = header;
            document.getElementById('toastMessage').innerText = msg;
            
            if (isError) {
                toast.classList.add('error-theme');
                actions.style.display = 'none';
                setTimeout(hideToast, 4000);
            } else {
                toast.classList.remove('error-theme');
                actions.style.display = 'flex';
            }
            
            toast.classList.add('show');
        }

        function hideToast() {
            document.getElementById('songToast').classList.remove('show');
            document.getElementById('ytLink').value = "";
        }

        function confirmPlay() {
            if (pendingVideoId) {
                player.loadVideoById(pendingVideoId);
                seconds = 0; // Reset for new marathon
                updateDisplay();
                hideToast();
            }
        }

        // 5. Progress Management
        function showFinishPopup() {
            document.getElementById('sessionTime').innerText = seconds;
            document.getElementById('finishPopup').classList.add('active');
        }

        function saveTime() {
            let total = parseInt(localStorage.getItem('marathonTime_v1') || 0);
            total += seconds;
            localStorage.setItem('marathonTime_v1', total);
            document.getElementById('totalSaved').innerText = total;
            
            seconds = 0;
            updateDisplay();
            closePopup();
        }

        function closePopup() {
            document.getElementById('finishPopup').classList.remove('active');
        }

        window.onload = () => {
            const saved = localStorage.getItem('marathonTime_v1') || 0;
            document.getElementById('totalSaved').innerText = saved;
        }
    </script>
</body>
</html>
